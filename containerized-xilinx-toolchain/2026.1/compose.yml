---

x-params-common-run: &params-common-run
    tty: true
    init: true
    stdin_open: true
    privileged: true
    working_dir: ${PWD}
    environment:
        - USER_ID=${USER_ID}
        - GROUP_ID=${GROUP_ID}
        - USER_NAME=${USER_NAME}
        - DISPLAY=${DISPLAY}
        - DEBUG_DOCKER=${DEBUG_DOCKER}

# The xilinx parameters are not needed for all builds but there's also no harm
# in having them here.
x-params-common-build: &params-common-build
    context: .
    args:
        USER_ID: ${USER_ID}
        GROUP_ID: ${GROUP_ID}
        USER_NAME: ${USER_NAME}
        XILINX_VERSION: ${XILINX_VERSION}

x-params-base-volumes: &params-base-volumes
    volumes:
        - ${PWD}:${PWD}
        - /tmp/.X11-unix:/tmp/.X11-unix

x-params-xilinx-volumes: &params-xilinx-volumes
    volumes:
        - ${PWD}:${PWD}
        - /tmp/.X11-unix:/tmp/.X11-unix
        - "${PWD}/.Xilinx:/home/${USER_NAME}/.Xilinx"
        - "${HOME}/.myenvs:/home/${USER_NAME}/.myenvs"
        - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
        # Vivado/Vitis is installed on the host (not inside the image) to
        # avoid xsetup running out of disk space during the docker build.
        # The container only supplies the OS and required libs; mount the
        # host install so the toolchain is available at runtime. Mounted
        # read-write so `make install_vivado` can also write the install
        # through this same mount (see the Makefile).
        - ${XILINX_INSTALL_DIR}:/tools/Xilinx

services:
    # Base ubuntu image
    base-u24:
        <<: [*params-common-run, *params-base-volumes]
        build:
            <<: *params-common-build
            dockerfile: layer0-base/Dockerfile-base
        image: base-u24
        hostname: base-u24
        container_name: base-u24

    # OS + libraries needed by Vivado/Vitis/Petalinux. Does NOT contain
    # Vivado/Vitis itself - `make install_vivado` reuses this same service
    # to run the installer against /tools/Xilinx. See README.md.
    xilinx-dependencies:
        <<: [*params-common-run, *params-xilinx-volumes]
        build:
            <<: *params-common-build
            dockerfile: layer1-xilinx/Dockerfile-xilinx-dependencies
            args:
                USER_ID: ${USER_ID}
                GROUP_ID: ${GROUP_ID}
                USER_NAME: ${USER_NAME}
                XILINX_VERSION: ${XILINX_VERSION}
                BASE_IMAGE: ${BASE_IMAGE}
                EXTEND_BASE: ${EXTEND_BASE}
        image: xilinx-dependencies
        hostname: xilinx-dependencies
        container_name: xilinx-dependencies
        # Run as the host user's own UID/GID (mapped 1:1 into the
        # container) instead of the default rootless subuid range, so
        # anything written to host bind mounts is owned by the real host
        # user. Safe here because the entrypoint no longer needs root (the
        # sudoers grant is baked into the image at build time).
        userns_mode: "keep-id"
